<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今週の賛美">
<meta name="theme-color" content="#5b4b8a">
<title>今週の賛美</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#f3f0e9;--card:#fff;--ink:#2a2733;--sub:#8a8496;--line:#e7e2d8;--accent:#5b4b8a;--accent2:#c9a94e;--shadow:0 2px 14px rgba(40,30,70,.08)}
html.dark{--bg:#0c0e18;--card:#171a29;--ink:#eceaf4;--sub:#9a95ac;--line:#252838;--accent:#a48fe0;--accent2:#d8bc6a;--shadow:0 2px 16px rgba(0,0,0,.5)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);overscroll-behavior:none}
.wrap{max-width:680px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(16px + env(safe-area-inset-top)) 18px 10px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}
.brand{font-size:12px;letter-spacing:.16em;color:var(--accent);font-weight:700}
.h1{font-size:24px;font-weight:800;margin:3px 0 0;outline:none;min-width:40px}
.date{font-size:13.5px;color:var(--sub);margin-top:4px;outline:none;min-width:40px}
.h1[contenteditable]:focus,.date[contenteditable]:focus{border-bottom:2px solid var(--accent)}
.editbadge{font-size:10.5px;color:var(--sub);border:1px solid var(--line);border-radius:20px;padding:2px 8px;margin-top:6px;display:inline-block}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 13px;font-size:14px;font-weight:600;box-shadow:var(--shadow);cursor:pointer;flex:0 0 auto}
main{flex:1;padding:14px 14px 44px}
.hint{font-size:12.5px;color:var(--sub);text-align:center;margin:6px 0 14px}
.logoutbox{margin:26px 0 34px;text-align:center;font-size:12px;color:var(--sub);line-height:1.9}
.logoutbtn{background:none;border:0;color:var(--sub);font-size:12px;text-decoration:underline;padding:6px 12px;cursor:pointer;font-family:inherit}
.logoutbtn.arm{color:#c0392b;font-weight:700;text-decoration:none;border:1px solid #c0392b;border-radius:20px}
.song{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin-bottom:11px;box-shadow:var(--shadow);cursor:pointer;transition:transform .07s}
.song:active{transform:scale(.985)}
.num{min-width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:0 0 auto}
.st{flex:1;min-width:0}.st .t{font-size:17px;font-weight:700;line-height:1.25}
.st .s{font-size:12.5px;color:var(--sub);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:20px;padding:3px 9px;flex:0 0 auto}
.chev{color:var(--sub);font-size:20px;flex:0 0 auto}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:800;background:var(--accent);color:#fff;box-shadow:var(--shadow);cursor:pointer;margin-top:10px}
.btn.ghost{background:var(--card);color:var(--accent);border:1.5px solid var(--accent)}
.btn.gold{background:var(--accent2);color:#3a2f10}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px}
.search{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:15px;margin-bottom:12px}
.lib .song .add{border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:10px;padding:7px 12px;font-weight:700;font-size:13px;flex:0 0 auto;cursor:pointer}
.idxbar{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.idxbar button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;min-width:36px;padding:8px 6px;font-size:15px;font-weight:800;cursor:pointer;line-height:1}
.idxbar button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.lib .song.sel .add{background:var(--accent);color:#fff}
.secttl{font-size:13px;font-weight:800;color:var(--sub);letter-spacing:.05em;margin:20px 4px 10px}
.mv{display:flex;flex-direction:column;gap:3px;margin-right:2px}
.mv button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:7px;width:30px;height:22px;font-size:12px;cursor:pointer;padding:0}
.rm{color:#c0475a;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 10px;font-weight:700;font-size:13px;cursor:pointer}
.share{background:var(--card);border:1px dashed var(--accent);border-radius:14px;padding:14px;margin-top:12px}
.share .u{font-size:12.5px;color:var(--accent);word-break:break-all;background:var(--bg);padding:10px 11px;border-radius:9px;margin:9px 0}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:30px;font-size:14px;font-weight:700;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.center{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--sub);padding:24px;text-align:center}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* unlock */
.lock{max-width:360px;margin:0 auto;width:100%}
.lock h2{font-size:20px;font-weight:800;margin:0 0 4px}
.lock p{font-size:13px;color:var(--sub);margin:0 0 18px;line-height:1.5}
.lock input{width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:14px;font-size:17px;text-align:center;letter-spacing:.05em}
.lock .err{color:#c0475a;font-size:13px;font-weight:700;min-height:18px;margin-top:8px}
/* viewer (full screen, zero chrome) */
.viewer{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column}
.viewer.on{display:flex}
.vclose{position:absolute;top:calc(8px + env(safe-area-inset-top));left:10px;z-index:6;width:34px;height:34px;border-radius:50%;border:none;background:rgba(20,18,30,.26);color:rgba(255,255,255,.92);font-size:15px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);padding:0;transition:opacity .35s}
.vclose.hid{opacity:0;pointer-events:none}
.flagbtn{position:absolute;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:6;width:44px;height:44px;border-radius:50%;border:none;background:rgba(20,18,30,.42);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);transition:opacity .35s;padding:0}
.flagbtn.hid{opacity:0;pointer-events:none}
.sheet{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.45);display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheetbox{background:var(--card);width:100%;max-width:680px;margin:0 auto;border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
.sheetbox h3{margin:0 0 3px;font-size:16px;font-weight:800}
.sheetbox .sub{font-size:12.5px;color:var(--sub)}
.cats{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
.cats button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer}
.cats button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.sheetbox textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px;font-size:15px;min-height:80px;font-family:inherit}
.note{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:10px;box-shadow:var(--shadow)}
.note .nh{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--sub);flex-wrap:wrap}
.note .nt{font-size:15px;font-weight:800;margin:6px 0 3px}
.note .nb{font-size:14px;line-height:1.5;white-space:pre-wrap}
.note .na{display:flex;gap:8px;margin-top:10px}
.note .na button{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px;font-size:12.5px;font-weight:700;cursor:pointer}
.note.done{opacity:.55}
.tag{font-size:10.5px;font-weight:800;border-radius:20px;padding:2px 8px;border:1px solid var(--accent);color:var(--accent)}
.lyr{font-size:10.5px;color:var(--accent2);border:1px solid var(--accent2);border-radius:20px;padding:2px 7px;flex:0 0 auto;font-weight:700}
html.dark .lyr{color:var(--accent2);border-color:var(--accent2)}
.pv{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:9px;padding:6px 9px;font-size:12px;font-weight:700;cursor:pointer;flex:0 0 auto}
.stage{flex:1;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;background:var(--bg)}
.slide{scroll-snap-align:start;scroll-snap-stop:always;padding:0;position:relative;background:var(--bg)}
.slide img{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none;background:#fff}
.slide.load{min-height:100%}
.slide.load::after{content:"";position:absolute;left:50%;top:50%;margin:-15px 0 0 -15px;width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
.slide.zoom{overflow:auto}
.slide.zoom img{max-width:none;max-height:none;width:190%;object-fit:unset}
.pageflag{position:absolute;top:calc(7px + env(safe-area-inset-top));right:9px;background:rgba(0,0,0,.5);color:#fff;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;pointer-events:none;z-index:3}
.edge{position:absolute;top:0;bottom:0;width:15%;z-index:2}.edge.l{left:0}.edge.r{right:0}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="center"><div class="spin"></div><div>読み込み中…</div></div></div>
<div class="viewer" id="viewer"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<script>
const BUILD='20260821a';
const LS_DRAFT='ws_draft_v1',LS_DARK='ws_dark_v1',LS_K='ws_k_v1',LS_HIDE='ws_hidden_v1',LS_PAT='ws_pat_v1';
const REPO_API='https://api.github.com/repos/Shouronpoumanju/sanbi-k4m2p8/contents/setlist.enc';
const KEYS_API='https://api.github.com/repos/Shouronpoumanju/sanbi-k4m2p8/contents/keys.json';
const LS_ADMIN='ws_admin_v1',LS_ROLE='ws_role_v1';
const NOTES_API='https://api.github.com/repos/Shouronpoumanju/sanbi-k4m2p8/contents/notes.enc';
let NOTES=[];
function role(){const r=load(LS_ROLE);if(r)return r;return load(LS_ADMIN)?'admin':'viewer'}
function isAdmin(){return role()==='admin'}
function isLib(){return role()==='lib'}
function isLead(){return role()==='lead'}
function canSelect(){return isAdmin()||isLead()}
function isStaff(){return isAdmin()||isLib()||isLead()}
const ROLENAME={admin:'管理者',lead:'選曲担当',lib:'司書（楽譜管理）',viewer:'メンバー'};
let PUB=null;
let SONGS=[],BYID={},route='home',CKEY=null,KEYS=null,libGrp=null;
let dark=load(LS_DARK)||false; if(dark)document.documentElement.classList.add('dark');
let shared=null;
let draft=load(LS_DRAFT)||{t:'今週の賛美',s:nextSunday()+' 礼拝',l:[]};
function load(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),3200)}
function emsg(e){const m=''+(e&&e.message||e);if(/401/.test(m))return 'トークンが無効か期限切れです。管理画面の「配信設定」で新しいトークンを保存してください';if(/403/.test(m))return 'GitHubに拒否されました（権限不足かAPI制限）。少し待つかトークンを確認してください';if(/409|422/.test(m))return '他の端末と同時に保存されたようです。もう一度お試しください';return m}
function nextSunday(){const d=new Date();d.setDate(d.getDate()+((7-d.getDay())%7));return `${d.getMonth()+1}月${d.getDate()}日(日)`}
function esc(t){return(t||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function enc8(s){return new TextEncoder().encode(s)}
function b64d(s){const b=atob(s);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function b64e(buf){let s='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
const app=document.getElementById('app');

/* ---------- crypto ---------- */
async function deriveKEK(passcode,saltB64,iters){
  const base=await crypto.subtle.importKey('raw',enc8(passcode),{name:'PBKDF2'},false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64d(saltB64),iterations:iters,hash:'SHA-256'},base,256);
  return crypto.subtle.importKey('raw',bits,{name:'AES-GCM'},false,['decrypt']);
}
const TIERS=[{r:'viewer',s:'salt',w:'wrapped',t:null},
             {r:'lead',s:'salt4',w:'wrapped4',t:'tokenw4'},
             {r:'lib',s:'salt3',w:'wrapped3',t:'tokenw3'},
             {r:'admin',s:'salt2',w:'wrapped2',t:'tokenw'}];
async function unlockWith(passcode){
  let rawK=null,hit=null;
  for(let i=0;i<TIERS.length;i++){
    const T=TIERS[i];
    if(!KEYS[T.w]||!KEYS[T.s])continue;
    try{
      const kek=await deriveKEK(passcode,KEYS[T.s],KEYS.iters);
      const w=b64d(KEYS[T.w]);
      rawK=await crypto.subtle.decrypt({name:'AES-GCM',iv:w.slice(0,12)},kek,w.slice(12));
      hit=T;
      if(T.t&&KEYS[T.t]){
        try{const tw=b64d(KEYS[T.t]);
          save(LS_PAT,new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:tw.slice(0,12)},kek,tw.slice(12))));
        }catch(et){}
      }
      break;
    }catch(e){}
  }
  if(!hit)throw new Error('bad passcode');
  save(LS_ROLE,hit.r);save(LS_ADMIN,hit.r==='admin');
  if(hit.r==='admin'&&!KEYS.tokenw&&load(LS_PAT)){
    try{
      const base2=await crypto.subtle.importKey('raw',enc8(passcode),{name:'PBKDF2'},false,['deriveBits']);
      const bits2=await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64d(KEYS.salt2),iterations:KEYS.iters,hash:'SHA-256'},base2,256);
      const ek2=await crypto.subtle.importKey('raw',bits2,{name:'AES-GCM'},false,['encrypt']);
      const tiv=crypto.getRandomValues(new Uint8Array(12));
      const tct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:tiv},ek2,enc8(load(LS_PAT))));
      const tw2=new Uint8Array(12+tct.length);tw2.set(tiv);tw2.set(tct,12);
      const pat=load(LS_PAT);const H2={'Authorization':'Bearer '+pat,'Accept':'application/vnd.github+json'};
      const r2=await fetch(KEYS_API+'?ref=main&cb='+Date.now(),{headers:H2,cache:'no-store'});
      if(r2.ok){const meta2=await r2.json();const cur2=JSON.parse(atob((meta2.content||'').replace(/\n/g,'')));
        cur2.tokenw=b64e(tw2.buffer);KEYS.tokenw=cur2.tokenw;
        await fetch(KEYS_API,{method:'PUT',headers:H2,body:JSON.stringify({message:'token sync',content:btoa(JSON.stringify(cur2)),branch:'main',sha:meta2.sha})});
      }
    }catch(e){}
  }
  CKEY=await crypto.subtle.importKey('raw',rawK,{name:'AES-GCM'},false,['encrypt','decrypt']);
  save(LS_K,b64e(rawK));
}
async function importStoredK(kB64){CKEY=await crypto.subtle.importKey('raw',b64d(kB64),{name:'AES-GCM'},false,['encrypt','decrypt'])}
async function decBuf(path,fresh){
  const buf=await (await fetch(path,{cache:fresh?'no-cache':'force-cache'})).arrayBuffer();const u=new Uint8Array(buf);
  return crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},CKEY,u.slice(12));
}
async function decJSON(path){return JSON.parse(new TextDecoder().decode(await decBuf(path,true)))}
const imgCache={};
async function decImg(path){if(imgCache[path])return imgCache[path];const b=await decBuf(path);const url=URL.createObjectURL(new Blob([b],{type:'image/webp'}));imgCache[path]=url;return url}

/* ---------- boot ---------- */
(async()=>{
  if(location.hash==='#reset'){try{localStorage.removeItem(LS_K);localStorage.removeItem(LS_ADMIN);localStorage.removeItem(LS_ROLE);localStorage.removeItem(LS_PAT)}catch(e){};history.replaceState(null,'',location.pathname)}
  try{
    const rb=await fetch('build.txt?cb='+Date.now(),{cache:'no-store'});
    if(rb.ok){const bt=(await rb.text()).trim();
      if(bt&&bt.length<40&&bt!==BUILD&&sessionStorage.getItem('ws_upd')!==bt){
        sessionStorage.setItem('ws_upd',bt);
        location.replace(location.pathname+'?b='+encodeURIComponent(bt)+location.hash);return;}}
  }catch(e){}
  try{KEYS=await fetch('keys.json?cb='+Date.now(),{cache:'no-store'}).then(r=>r.json())}catch(e){app.innerHTML='<div class="center">読み込みに失敗しました。</div>';return}
  const sk=load(LS_K);
  if(sk){try{await importStoredK(sk);await boot();return}catch(e){}}
  showUnlock();
})();
function showUnlock(msg){
  app.innerHTML=`<div class="center"><div class="lock">
    <h2>🔒 合言葉を入力</h2>
    <p>このアプリはチーム限定です。合言葉はこの端末で最初の1回だけ。次回からは自動で開きます。</p>
    <input id="pc" type="password" inputmode="text" placeholder="合言葉" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
    <div class="err" id="err">${msg||''}</div>
    <button class="btn" id="go" style="margin-top:14px">開く</button>
  </div></div>`;
  const pc=document.getElementById('pc'),go=document.getElementById('go');
  const tryit=async()=>{go.disabled=true;document.getElementById('err').textContent='確認中…';
    const raw=pc.value.trim();
    const vars=[raw];
    if(raw.toLowerCase()!==raw)vars.push(raw.toLowerCase());
    if(raw&&raw[0].toLowerCase()!==raw[0])vars.push(raw[0].toLowerCase()+raw.slice(1));
    try{let ok=false,last=null;
      for(let i=0;i<vars.length;i++){try{await unlockWith(vars[i]);ok=true;break}catch(e){last=e}}
      if(!ok)throw last||new Error('bad');
      await boot();}
    catch(e){go.disabled=false;showUnlock('合言葉が違います。もう一度お試しください。');}};
  go.onclick=tryit; pc.addEventListener('keydown',e=>{if(e.key==='Enter')tryit()}); pc.focus();
}
async function boot(){
  app.innerHTML='<div class="center"><div class="spin"></div><div>展開中…</div></div>';
  SONGS=await decJSON('data.enc');BYID={};SONGS.forEach(s=>BYID[s.id]=s);
  PUB=await fetchPub();
  if(isStaff())NOTES=await fetchNotes();
  shared=parseHash();render();
  window.addEventListener('hashchange',()=>{if(location.hash==='#reset'){try{localStorage.removeItem(LS_K);localStorage.removeItem(LS_ADMIN);localStorage.removeItem(LS_ROLE);localStorage.removeItem(LS_PAT)}catch(e){};location.reload();return}shared=parseHash();route='home';render()});
}

function parseHash(){const h=location.hash.replace(/^#/,'');if(!h)return null;const p=new URLSearchParams(h);const l=(p.get('l')||'').split(',').filter(Boolean);if(!l.length)return null;const d=+(p.get('d')||0);if(!d||Date.now()-d>604800000)return{expired:true};return{t:decodeURIComponent(p.get('t')||'今週の賛美'),s:decodeURIComponent(p.get('s')||''),l}}
function buildLink(o){return location.origin+location.pathname+'#t='+encodeURIComponent(o.t)+'&s='+encodeURIComponent(o.s)+'&l='+o.l.join(',')+'&d='+Date.now()}
async function fetchPub(){
  let u=null;
  try{const ac=new AbortController();const tm=setTimeout(()=>ac.abort(),6000);
    const r=await fetch(REPO_API+'?ref=main&cb='+Date.now(),{headers:{'Accept':'application/vnd.github.raw'},cache:'no-store',signal:ac.signal});clearTimeout(tm);
    if(r.ok)u=b64d((await r.text()).trim());}catch(e){}
  if(!u){try{const r2=await fetch('setlist.enc',{cache:'no-cache'});if(r2.ok)u=b64d((await r2.text()).trim());}catch(e){}}
  if(!u||u.length<13)return null;
  try{const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},CKEY,u.slice(12));
    const o=JSON.parse(new TextDecoder().decode(pt));

async function fetchNotes(){

async function saveNotes(list){

  const ek=await crypto.subtle.importKey('raw',b64d(load(LS_K)),{name:'AES-GCM'},false,['encrypt']);
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},ek,enc8(JSON.stringify(list))));
  const full=new Uint8Array(12+ct.length);full.set(iv);full.set(ct,12);
  const H={'Authorization':'Bearer '+pat,'Accept':'application/vnd.github+json'};
  let sha=null;
  try{const r=await fetch(NOTES_API+'?ref=main&cb='+Date.now(),{headers:H,cache:'no-store'});if(r.ok)sha=(await r.json()).sha}catch(e){}
  const res=await fetch(NOTES_API,{method:'PUT',headers:H,body:JSON.stringify(Object.assign({message:'notes update',content:btoa(b64e(full.buffer)),branch:'main'},sha?{sha:sha}:{}))});
  if(!res.ok)throw new Error('HTTP '+res.status);
  NOTES=list;
}

async function setTierPass(kind){

    const H={'Authorization':'Bearer '+pat,'Accept':'application/vnd.github+json'};

    if(!r.ok)throw new Error('HTTP '+r.status);
    const meta=await r.json();
    const cur=JSON.parse(atob((meta.content||'').replace(/\n/g,'')));
    const salt=crypto.getRandomValues(new Uint8Array(16));
    const base=await crypto.subtle.importKey('raw',enc8(np),{name:'PBKDF2'},false,['deriveBits']);

    const kek=await crypto.subtle.importKey('raw',bits,{name:'AES-GCM'},false,['encrypt']);
    const iv1=crypto.getRandomValues(new Uint8Array(12));
    const c1=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv1},kek,b64d(load(LS_K))));
    const wr=new Uint8Array(12+c1.length);wr.set(iv1);wr.set(c1,12);
    const iv2=crypto.getRandomValues(new Uint8Array(12));
    const c2=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv2},kek,enc8(pat)));
    const tk=new Uint8Array(12+c2.length);tk.set(iv2);tk.set(c2,12);
    cur[C.s]=b64e(salt.buffer);cur[C.w]=b64e(wr.buffer);cur[C.t]=b64e(tk.buffer);
    const res=await fetch(KEYS_API,{method:'PUT',headers:H,body:JSON.stringify({message:C.m,content:btoa(JSON.stringify(cur)),branch:'main',sha:meta.sha})});
    if(!res.ok)throw new Error('HTTP '+res.status);
    KEYS[C.s]=cur[C.s];KEYS[C.w]=cur[C.w];KEYS[C.t]=cur[C.t];
    document.getElementById(C.i).value='';
    document.getElementById(C.st).textContent='（設定済み）';
    toast('設定しました（反映まで約1分）');
  }catch(e){toast('設定に失敗しました：'+emsg(e))}
  btn.disabled=false;btn.textContent=C.n;
}
async function changeViewerPass(){
  const pat=load(LS_PAT);
  if(!pat){toast('先に配信設定でトークンを保存してください');return}
  const np=document.getElementById('npass').value.trim();
  if(np.length<6){toast('6文字以上にしてください');return}
  const btn=document.getElementById('npasssave');btn.disabled=true;btn.textContent='変更中…';
  try{
    const H={'Authorization':'Bearer '+pat,'Accept':'application/vnd.github+json'};
    const r=await fetch(KEYS_API+'?ref=main&cb='+Date.now(),{headers:H,cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const meta=await r.json();
    const cur=JSON.parse(atob((meta.content||'').replace(/\n/g,'')));
    const rawK=b64d(load(LS_K));
    const salt=crypto.getRandomValues(new Uint8Array(16));
    const base=await crypto.subtle.importKey('raw',enc8(np),{name:'PBKDF2'},false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:cur.iters,hash:'SHA-256'},base,256);
    const kek=await crypto.subtle.importKey('raw',bits,{name:'AES-GCM'},false,['encrypt']);
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},kek,rawK));
    const w=new Uint8Array(12+ct.length);w.set(iv);w.set(ct,12);
    const nk={salt:b64e(salt.buffer),iters:cur.iters,wrapped:b64e(w.buffer),salt2:cur.salt2,wrapped2:cur.wrapped2,tokenw:cur.tokenw,salt3:cur.salt3,wrapped3:cur.wrapped3,tokenw3:cur.tokenw3};
    const res=await fetch(KEYS_API,{method:'PUT',headers:H,body:JSON.stringify({message:'passphrase update',content:btoa(JSON.stringify(nk)),branch:'main',sha:meta.sha})});
    if(!res.ok)throw new Error('HTTP '+res.status);
    document.getElementById('npass').value='';
    toast('合言葉を変更しました（反映まで約1分）');
  }catch(e){toast('変更に失敗しました：'+emsg(e))}
  btn.disabled=false;btn.textContent='合言葉を変更';
}
function drawSel(){const box=document.getElementById('selbox');if(!box)return;box.innerHTML='';const c=document.getElementById('cnt');if(c)c.textContent=draft.l.length;
  if(!draft.l.length){box.innerHTML='<div class="hint">まだ曲がありません。下のライブラリから追加してください。</div>';return}
  draft.l.forEach((id,i)=>{const s=BYID[id];if(!s)return;const el=document.createElement('div');el.className='song';
    el.innerHTML=`<div class="mv"><button data-u="${i}">▲</button><button data-d="${i}">▼</button></div><div class="num">${i+1}</div><div class="st"><div class="t">${esc(s.title)}</div></div><button class="pv" data-v="${i}">楽譜</button><button class="rm" data-r="${i}">外す</button>`;
    box.appendChild(el);});
  box.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>mv(+b.dataset.u,-1));
  box.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>mv(+b.dataset.d,1));
  box.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{draft.l.splice(+b.dataset.r,1);save(LS_DRAFT,draft);drawSel();drawLib(document.getElementById('q').value)});
  box.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const ids=draft.l.filter(id=>BYID[id]);openViewer(ids,+b.dataset.v)});}
function mv(i,d){const j=i+d;if(j<0||j>=draft.l.length)return;[draft.l[i],draft.l[j]]=[draft.l[j],draft.l[i]];save(LS_DRAFT,draft);drawSel()}
function GORD(g){const j='あかさたなはまやらわ'.indexOf(g);if(j>=0)return j;if(g>='A'&&g<='Z')return 10+g.charCodeAt(0)-65;return 99}
function grpList(){return [...new Set(SONGS.map(s=>s.g))].sort((a,b)=>GORD(a)-GORD(b))}
function libItem(s,lyric){const viewOnly=(route==='lib');const on=draft.l.includes(s.id);const el=document.createElement('div');el.className='song'+(on?' sel':'');
  el.innerHTML=`<div class="st"><div class="t">${esc(s.title)}</div><div class="s">${s.pages.length}ページ</div></div>${lyric?'<div class="lyr">歌詞</div>':''}<button class="pv">楽譜</button>${viewOnly?'':`<button class="add">${on?'追加済':'＋ 追加'}</button>`}`;
  el.querySelector('.pv').onclick=()=>openViewer([s.id],0);
  if(viewOnly){el.onclick=e=>{if(!e.target.closest('button'))openViewer([s.id],0)};}
  else el.querySelector('.add').onclick=()=>{on?draft.l.splice(draft.l.indexOf(s.id),1):draft.l.push(s.id);save(LS_DRAFT,draft);drawSel();drawLib(document.getElementById('q').value)};
  return el;}
function nrm(t){t=(t||'').normalize('NFKC').toLowerCase();
  t=t.replace(/[\u30a1-\u30f6]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0x60)});
  return t.replace(/[\s\u3000]+/g,'').replace(/[、。,\.'"()（）\[\]「」・:;!！?？\-–—_/\\|=+*#~^`&%$@<>]/g,'');}
function drawLib(q){const box=document.getElementById('libbox'),bar=document.getElementById('idxbar');if(!box)return;
  q=(q||'').trim().toLowerCase();box.innerHTML='';
  if(q){if(bar)bar.style.display='none';let n=0;
    const nq=nrm(q);
    const A=[],B=[];
    for(const s of SONGS){
      if(s.title.toLowerCase().includes(q)||(s.y||'').includes(q)){A.push(s);continue}
      if(nq.length>=2&&(s.x||'').includes(nq)){B.push(s);continue}
    }
    A.forEach(s=>{if(++n<=400)box.appendChild(libItem(s))});
    if(B.length){const h=document.createElement('div');h.className='secttl';h.textContent='歌詞に一致（'+B.length+'曲）';box.appendChild(h);
      B.forEach(s=>{if(++n<=400)box.appendChild(libItem(s,true))});}
    if(!n)box.innerHTML='<div class="hint">見つかりませんでした</div>';return;}
  const gs=grpList();if(libGrp==null||!gs.includes(libGrp))libGrp=gs[0];
  if(bar){bar.style.display='flex';bar.innerHTML='';gs.forEach(g=>{const b=document.createElement('button');b.textContent=g;if(g===libGrp)b.className='on';b.onclick=()=>{libGrp=g;const q2=document.getElementById('q');if(q2)q2.value='';drawLib('')};bar.appendChild(b);});}
  for(const s of SONGS){if(s.g!==libGrp)continue;box.appendChild(libItem(s));}}

/* ---------- viewer ---------- */
const V=document.getElementById('viewer');
let vIds=[],vSong=0;
function cur(){return BYID[vIds[vSong]]}
function openViewer(ids,idx,page){vIds=ids;vSong=idx;buildViewer();V.classList.add('on');preload(idx+1);
  if(page&&page>1){setTimeout(()=>{const st=document.getElementById('stage');const sl=st?st.querySelectorAll('.slide'):[];if(sl[page-1])st.scrollTop=sl[page-1].offsetTop},250)}}
function closeViewer(){V.classList.remove('on')}
async function preload(i){const s=BYID[vIds[i]];if(!s)return;for(const p of s.pages){try{await decImg(p)}catch(e){}}}
function buildViewer(){
  const s=cur();
  const slides=s.pages.map((p,pi)=>`<div class="slide load"><img data-enc="${p}" alt="">${s.pages.length>1?`<div class="pageflag">${pi+1} / ${s.pages.length}</div>`:''}</div>`).join('');
  V.innerHTML=`<div class="stage" id="stage">${slides}<div class="edge l" id="el"></div><div class="edge r" id="er"></div></div>
   <button class="vclose" id="vx" aria-label="閉じる">✕</button>${isStaff()?'<button class="flagbtn" id="vflag" aria-label="メモ">🚩</button>':''}`;
  const stage=document.getElementById('stage');stage.scrollTop=0;
  hydrate();
  const vx=document.getElementById('vx');
  vx.onclick=e=>{e.stopPropagation();closeViewer()};
  const vf=document.getElementById('vflag');
  const poke=()=>{vx.classList.remove('hid');if(vf)vf.classList.remove('hid');clearTimeout(vx._h);vx._h=setTimeout(()=>{vx.classList.add('hid');if(vf)vf.classList.add('hid')},2500)};
  poke();
  stage.addEventListener('click',poke);
  if(vf)vf.onclick=e=>{e.stopPropagation();openNoteSheet()};
  document.getElementById('el').onclick=()=>go(vSong-1);
  document.getElementById('er').onclick=()=>go(vSong+1);
  // double-tap zoom
  stage.querySelectorAll('img').forEach(img=>img.addEventListener('click',()=>{const n=Date.now();if(n-(img._lt||0)<300)zoom(img);img._lt=n}));
  // swipe song
  let sx=0,sy=0;
  stage.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  stage.addEventListener('touchend',e=>{if(stage.querySelector('.slide.zoom'))return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.6)go(vSong+(dx<0?1:-1))},{passive:true});
}
function curPage(){const st=document.getElementById('stage');if(!st)return 1;const sl=[...st.querySelectorAll('.slide')];let best=1,bd=1e9;sl.forEach((s,i)=>{const d=Math.abs(s.offsetTop-st.scrollTop);if(d<bd){bd=d;best=i+1}});return best}
let noteCat=CATS[0];
function openNoteSheet(){
  const s=cur();if(!s)return;
  const pg=curPage();
  noteCat=CATS[0];
  const sh=document.getElementById('sheet');
  sh.innerHTML=`<div class="sheetbox">
    <h3>🚩 気づきメモ</h3>
    <div class="sub">${esc(s.title)}${s.pages.length>1?'（'+pg+'ページ目）':''}</div>
    <div class="cats" id="cats">${CATS.map((c,i)=>`<button data-c="${i}"${i===0?' class="on"':''}>${c}</button>`).join('')}</div>
    <textarea id="ntext" placeholder="例：2段目のコードが違う／3行目の歌詞が抜けている"></textarea>
    <button class="btn" id="nsave">メモを保存</button>
    <button class="btn ghost" id="ncancel" style="margin-top:8px">キャンセル</button>
  </div>`;
  sh.classList.add('on');
  sh.querySelectorAll('#cats button').forEach(b=>b.onclick=()=>{noteCat=CATS[+b.dataset.c];sh.querySelectorAll('#cats button').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
  document.getElementById('ncancel').onclick=()=>sh.classList.remove('on');
  sh.onclick=e=>{if(e.target===sh)sh.classList.remove('on')};
  document.getElementById('ntext').focus();
  document.getElementById('nsave').onclick=async()=>{
    const t=document.getElementById('ntext').value.trim();
    if(!t){toast('内容を書いてください');return}
    const btn=document.getElementById('nsave');btn.disabled=true;btn.textContent='保存中…';
    const n={id:'n'+Date.now()+Math.floor(Math.random()*1000),sid:s.id,title:s.title,page:pg,cat:noteCat,text:t,by:ROLENAME[role()]||'メンバー',at:Date.now(),done:false};
    const bak=NOTES.slice();
    try{await saveNotes(NOTES.concat([n]));sh.classList.remove('on');toast('メモを保存しました')}
    catch(e){NOTES=bak;btn.disabled=false;btn.textContent='メモを保存';toast('保存に失敗しました：'+emsg(e))}
  };
}
async function hydrate(){const imgs=[...document.querySelectorAll('#stage img[data-enc]')];for(const im of imgs){const p=im.getAttribute('data-enc');try{im.src=await decImg(p);im.parentElement.classList.remove('load')}catch(e){}im.removeAttribute('data-enc')}}
function go(i){if(i<0||i>=vIds.length)return;vSong=i;buildViewer();preload(i+1)}
function zoom(img){const sl=img.parentElement,st=document.getElementById('stage');if(sl.classList.toggle('zoom')){st.style.scrollSnapType='none'}else{st.style.scrollSnapType='y mandatory';sl.scrollTop=0;sl.scrollLeft=0}}
function toggleDark(){dark=!dark;document.documentElement.classList.toggle('dark',dark);save(LS_DARK,dark);const b=document.getElementById('toDark');if(b)b.textContent=dark?'☀️':'🌙'}
</script>
